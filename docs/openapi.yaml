openapi: 3.1.0

info:
  title: API Inventaris Barang
  description: RESTful API untuk mengelola produk dan kategori
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Local Development

tags:
  - name: Products
    description: CRUD produk
  - name: Categories
    description: CRUD kategori

paths:

  /api/v1/products:
    get:
      tags: [Products]
      summary: Mengambil seluruh produk
      description: Mendukung pencarian nama dan filter kategori
      parameters:
        - name: search
          in: query
          required: false
          description: Kata kunci nama produk
          schema:
            type: string
        - name: category_id
          in: query
          required: false
          description: Filter berdasarkan ID kategori
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Daftar produk berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Products]
      summary: Menambahkan produk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Produk berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1

    get:
      tags: [Products]
      summary: Mengambil detail produk
      responses:
        '200':
          description: Detail produk ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags: [Products]
      summary: Memperbarui produk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Produk berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [Products]
      summary: Menghapus produk
      responses:
        '204':
          description: Produk berhasil dihapus (tanpa response body)
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/categories:
    get:
      tags: [Categories]
      summary: Mengambil seluruh kategori
      responses:
        '200':
          description: Daftar kategori berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Categories]
      summary: Menambahkan kategori
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Kategori berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1

    get:
      tags: [Categories]
      summary: Mengambil detail kategori
      responses:
        '200':
          description: Detail kategori ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags: [Categories]
      summary: Memperbarui kategori
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Kategori berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [Categories]
      summary: Menghapus kategori
      responses:
        '204':
          description: Kategori berhasil dihapus (tanpa response body)
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

components:

  responses:
    BadRequest:
      description: JSON tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validasi gagal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Data masih berelasi dengan data lain
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Kesalahan internal server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    ProductInput:
      type: object
      required: [category_id, name, price, stock]
      properties:
        category_id:
          type: integer
          minimum: 1
          example: 1
        name:
          type: string
          minLength: 1
          maxLength: 150
          example: Printer Epson
        price:
          type: number
          minimum: 0
          example: 2500000
        stock:
          type: integer
          minimum: 0
          example: 5

    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              example: 4

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Aksesoris
        description:
          type: [string, 'null']
          example: Aksesoris komputer

    Category:
      allOf:
        - $ref: '#/components/schemas/CategoryInput'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              example: 4

    ProductResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/Product'

    ProductListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'

    CategoryResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/Category'

    CategoryListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Harga harus berupa angka nonnegatif


